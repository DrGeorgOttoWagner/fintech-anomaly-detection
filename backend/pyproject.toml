[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ftad"
version = "1.0.0"
description = "FinTech Anomaly Detection — local financial anomaly detection and ML research platform"
readme = "../README.md"
license = { text = "MIT" }
authors = [{ name = "Georg-Otto Wagner" }]
maintainers = [{ name = "Georg-Otto Wagner", email = "georg-otto.wagner@outlook.com" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "imbalanced-learn>=0.12",
  "xgboost>=2.0",
  "lightgbm>=4.3",
  "catboost>=1.2",
  "joblib>=1.4",
  "pyarrow>=16",
  "pydantic>=2.7",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ftad = "ftad.app:main"

[tool.setuptools.packages.find]
include = ["ftad*"]
